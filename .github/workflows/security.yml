# Pin comment: actions/checkout@v4 (11d5960a326750d5838078e36cf38b85af677262)
name: Security

on:
  pull_request:
    branches: [development]
  push:
    branches: [development]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION="v8.30.1"
          GITLEAKS_SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Scan for secrets
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            RANGE="${{ github.event.before }}..${{ github.event.after }}"
          else
            RANGE=""
          fi
          if [ -n "$RANGE" ]; then
            gitleaks detect --source . --log-opts="${RANGE}" --redact --verbose
          else
            gitleaks detect --source . --redact --verbose
          fi

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore CafeHub.Backend.sln

      - name: Audit package vulnerabilities
        run: |
          OUTPUT_FILE="$RUNNER_TEMP/audit-output.txt"
          dotnet list CafeHub.Backend.sln package --vulnerable --include-transitive > "$OUTPUT_FILE" 2>&1 || true
          cat "$OUTPUT_FILE" >> "$GITHUB_STEP_SUMMARY"
          if grep -Eq 'Severity:\s*(High|Critical)' "$OUTPUT_FILE"; then
            echo "## Dependency audit FAILED: High or Critical vulnerabilities found" >> "$GITHUB_STEP_SUMMARY"
            grep -B2 -A4 -E 'Severity:\s*(High|Critical)' "$OUTPUT_FILE" >> "$GITHUB_STEP_SUMMARY" || true
            echo "::error::Dependency audit detected High or Critical vulnerabilities."
            exit 1
          else
            echo "## Dependency audit passed: no High or Critical vulnerabilities" >> "$GITHUB_STEP_SUMMARY"
            if grep -Eq 'Severity:\s*(Moderate|Low)' "$OUTPUT_FILE"; then
              echo "### Lower-severity findings (reported, not failing)" >> "$GITHUB_STEP_SUMMARY"
              grep -B2 -A4 -E 'Severity:\s*(Moderate|Low)' "$OUTPUT_FILE" >> "$GITHUB_STEP_SUMMARY" || true
            fi
            echo "Dependency audit passed."
          fi
